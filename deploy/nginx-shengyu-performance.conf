# Shengyu static delivery tuning. The base nginx.conf already enables gzip.
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

# Fingerprinted assets and image resources may be cached; HTML and API responses
# keep their existing cache policy because unmatched content types default to off.
map $sent_http_content_type $shengyu_static_expires {
    default                off;
    text/css               30d;
    application/javascript 30d;
    image/avif             1d;
    image/webp             1d;
    image/png              1d;
    image/jpeg             1d;
    image/svg+xml          1d;
    font/woff2             7d;
}

expires $shengyu_static_expires;
